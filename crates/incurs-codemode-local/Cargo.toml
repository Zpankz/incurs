[package]
name = "incurs-codemode-local"
version = "0.12.0"
edition = "2024"
license = "MIT"
description = "Local QuickJS executor for incurs Code Mode"
repository = "https://github.com/douglance/incurs"
readme = "README.md"

[features]
default = ["quickjs", "sqlite"]
quickjs = []
sqlite = ["dep:rusqlite"]

[[example]]
name = "local"
required-features = ["quickjs", "sqlite"]

[dependencies]
async-trait = "0.1"
incurs-codemode = { path = "../incurs-codemode", version = "0.12.0" }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"

[build-dependencies]
cc = "1"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
incurs = { path = "../incurs", version = "0.14.0" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
