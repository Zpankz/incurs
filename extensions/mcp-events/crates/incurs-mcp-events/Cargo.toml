[package]
name = "incurs-mcp-events"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Platform-neutral MCP Events webhook delivery: subscribe, verify, sign, deliver, and receive"
readme = "README.md"

[dependencies]
async-trait.workspace = true
base64.workspace = true
hmac.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
url.workspace = true

[dev-dependencies]
# Insertion-ordered maps in tests prove identities do not depend on map order.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt"] }
