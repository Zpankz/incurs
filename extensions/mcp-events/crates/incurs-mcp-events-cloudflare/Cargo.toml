[package]
name = "incurs-mcp-events-cloudflare"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Cloudflare Durable Object storage, alarms, and fetch for incurs MCP Events webhooks"
readme = "README.md"

[dependencies]
async-trait.workspace = true
incurs-mcp-events = { path = "../incurs-mcp-events", version = "0.1.0" }
serde_json.workspace = true

# Durable Object storage, alarms, and fetch exist only in a Worker.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = "0.3"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
worker = "0.8.5"
